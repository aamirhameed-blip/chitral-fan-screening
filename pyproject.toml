[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fanscreen"
version = "1.0.0"
description = "Fan-based evaluation of Melton-ratio and machine-learning screening of debris-flow and flood catchments in Chitral, Pakistan"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Aamir Hameed", email = "aamir.hameed@uniba.it" },
    { name = "Pierluigi Confuorto" },
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "geopandas>=0.14",
    "shapely>=2.0",
    "rasterio>=1.3",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
sentinel2 = ["pystac-client", "planetary-computer", "odc-stac", "dask"]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "E741", "B905"]  # long lines: the formatter wraps code, long strings stay whole

[tool.ruff.lint.isort]
known-first-party = ["fanscreen"]
